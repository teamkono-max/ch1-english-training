<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>中1英語トレーニング</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f3f6fb;color:#172033}
.app{max-width:620px;margin:auto;min-height:100vh;background:#f3f6fb}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 16px calc(12px + env(safe-area-inset-top))}
h1{font-size:21px;margin:0;font-weight:800}.sub{font-size:12px;color:#64748b;margin-top:3px}
main{padding:16px 14px 90px}.screen{display:none}.screen.active{display:block}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 14px rgba(15,23,42,.06);margin-bottom:12px}
.hero{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff}
.hero h2{margin:0 0 8px;font-size:25px}.hero p{margin:0;line-height:1.6;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu{border:0;background:#fff;border-radius:16px;padding:17px 12px;text-align:left;box-shadow:0 2px 10px rgba(15,23,42,.06);font-size:15px;font-weight:700;color:#172033}
.menu small{display:block;color:#64748b;font-weight:500;margin-top:5px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.primary{width:100%;border:0;background:#2563eb;color:#fff;border-radius:13px;padding:14px;font-weight:800;margin-top:12px}.secondary{width:100%;border:1px solid #dbe1ea;background:#fff;border-radius:13px;padding:13px;font-weight:700;margin-top:9px}
.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#2563eb;width:0}
.qmeta{font-size:12px;color:#64748b}.qtext{font-size:22px;line-height:1.55;font-weight:800;margin:18px 0}
.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;border:1px solid #d8dee8;background:#fff;border-radius:13px;padding:14px;min-height:50px}.choice:disabled{opacity:1}.choice.correct{border:2px solid #16a34a;background:#f0fdf4}.choice.wrong{border:2px solid #dc2626;background:#fef2f2}
.input{width:100%;border:1px solid #cbd5e1;border-radius:13px;padding:14px;font-size:17px;margin-bottom:10px}.feedback{padding:14px;border-radius:13px;margin-top:12px;line-height:1.6}.ok{background:#ecfdf5;color:#166534}.ng{background:#fef2f2;color:#991b1b}
.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800;margin-right:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border-radius:14px;padding:13px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#64748b}
.list{display:grid;gap:8px}.row{background:#fff;border-radius:13px;padding:12px;border:1px solid #e5e7eb}.row b{font-size:14px}.muted{color:#64748b;font-size:12px}.empty{text-align:center;color:#64748b;padding:30px 10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid #e5e7eb;padding:8px max(12px,calc((100vw - 620px)/2 + 12px)) calc(8px + env(safe-area-inset-bottom));z-index:10;display:flex;gap:8px}.bottom button{flex:1;border:0;background:transparent;padding:6px;font-size:11px;color:#475569}.bottom button b{display:block;font-size:19px;margin-bottom:2px}.hidden{display:none!important}
.unitbtn{background:#fff;border:1px solid #dbe1ea;border-radius:14px;padding:14px;text-align:left}.unitbtn strong{font-size:16px}.unitbtn small{display:block;color:#64748b;margin-top:4px}
select{width:100%;padding:13px;border-radius:12px;border:1px solid #cbd5e1;background:#fff}
</style>
</head>
<body>
<div class="app">
<header><h1>中1英語トレーニング</h1><div class="sub">Unit 1〜4・中間テスト対策</div></header>
<main>
<section id="home" class="screen active">
<div class="card hero"><h2>今日も10問。</h2><p>学校で学習したUnit 1〜4を、1問ずつ解いて定着させよう。間違えた問題は自動で復習できます。</p><button class="primary" onclick="startMode('today')">今日の10問を始める</button></div>
<div class="grid">
<button class="menu" onclick="showUnits()">📚 Unit別<small>Unit 1〜4から選ぶ</small></button>
<button class="menu" onclick="startMode('midterm')">📝 中間テスト対策<small>Unit 3・4</small></button>
<button class="menu" onclick="startMode('wrong')">🔁 間違えた問題<small id="wrongCount">0問</small></button>
<button class="menu" onclick="showStats()">📊 学習記録<small>正答率・回答数</small></button>
</div>
<div class="card"><b>このアプリの特徴</b><p class="muted">問題データは作成済みの100問マスターを内蔵。回答履歴はこのiPhoneのブラウザ内に保存されます。</p></div>
</section>

<section id="units" class="screen">
<div class="card"><h2>Unitを選ぶ</h2><div class="list">
<button class="unitbtn" onclick="startMode('unit',1)"><strong>Unit 1</strong><small>I'm ～／一般動詞／can</small></button>
<button class="unitbtn" onclick="startMode('unit',2)"><strong>Unit 2</strong><small>疑問文／否定文／Can you ～?</small></button>
<button class="unitbtn" onclick="startMode('unit',3)"><strong>Unit 3</strong><small>what／-ing／to＋動詞</small></button>
<button class="unitbtn" onclick="startMode('unit',4)"><strong>Unit 4</strong><small>This/That／Who／Is／Whose</small></button>
</div></div>
<button class="secondary" onclick="goHome()">← ホームへ</button>
</section>

<section id="quiz" class="screen">
<div class="card">
<div id="qmeta" class="qmeta"></div><div class="progress"><div id="bar" class="bar"></div></div>
<div id="qtext" class="qtext"></div>
<div id="answerArea"></div>
<div id="feedback"></div>
<button id="nextBtn" class="primary hidden" onclick="nextQuestion()">次の問題 →</button>
</div>
</section>

<section id="stats" class="screen">
<div class="card"><h2>学習記録</h2><div class="stats">
<div class="stat"><b id="sAttempts">0</b><span>回答数</span></div><div class="stat"><b id="sCorrect">0</b><span>正解数</span></div><div class="stat"><b id="sRate">0%</b><span>正答率</span></div>
</div></div>
<div class="card"><b>学習項目別</b><div id="itemStats" class="list" style="margin-top:10px"></div></div>
<div class="card"><button class="secondary" onclick="resetData()">学習履歴をリセット</button></div>
</section>

<section id="result" class="screen">
<div class="card hero"><h2 id="resultTitle">お疲れさま！</h2><p id="resultText"></p></div>
<div class="card"><div class="stats"><div class="stat"><b id="rCorrect">0</b><span>正解</span></div><div class="stat"><b id="rTotal">0</b><span>問題</span></div><div class="stat"><b id="rRate">0%</b><span>正答率</span></div></div></div>
<button class="primary" onclick="goHome()">ホームへ</button><button class="secondary" onclick="startMode('wrong')">間違えた問題を復習</button>
</section>
</main>
<div class="bottom">
<button onclick="goHome()"><b>⌂</b>ホーム</button><button onclick="showUnits()"><b>▦</b>Unit</button><button onclick="startMode('wrong')"><b>↻</b>復習</button><button onclick="showStats()"><b>▥</b>記録</button>
</div>
</div>
<script>
const QUESTIONS = [{"id":"Q001","unit":"1","category":"単語・熟語","type":"4択","item":"U1-01","question":"「美しい」に当たる英語はどれですか？","answer":"beautiful","choices":["beautiful / class / fall / here"],"explanation":"「美しい」は beautiful です。","level":"標準","midterm":false,"source":"Unit 1 単語チェック"},{"id":"Q002","unit":"1","category":"単語・熟語","type":"4択","item":"U1-01","question":"「季節」に当たる英語はどれですか？","answer":"season","choices":["season / thing / Japan / there"],"explanation":"「季節」は season です。","level":"標準","midterm":false,"source":"Unit 1 単語チェック"},{"id":"Q003","unit":"1","category":"単語・熟語","type":"4択","item":"U1-01","question":"「生徒、学生」に当たる英語はどれですか？","answer":"student","choices":["student / fall / here / cool"],"explanation":"「生徒、学生」は student です。","level":"標準","midterm":false,"source":"Unit 1 単語チェック"},{"id":"Q004","unit":"1","category":"単語・熟語","type":"4択","item":"U1-01","question":"「住む、住んでいる」に当たる英語はどれですか？","answer":"live","choices":["live / Japan / there / hello"],"explanation":"「住む、住んでいる」は live です。","level":"標準","midterm":false,"source":"Unit 1 単語チェック"},{"id":"Q005","unit":"1","category":"単語・熟語","type":"4択","item":"U1-01","question":"「泳ぐ、水泳をする」に当たる英語はどれですか？","answer":"swim","choices":["swim / here / cool / class"],"explanation":"「泳ぐ、水泳をする」は swim です。","level":"標準","midterm":false,"source":"Unit 1 単語チェック"},{"id":"Q006","unit":"1","category":"単語・熟語","type":"4択","item":"U1-01","question":"「冬」に当たる英語はどれですか？","answer":"winter","choices":["winter / there / hello / thing"],"explanation":"「冬」は winter です。","level":"標準","midterm":false,"source":"Unit 1 単語チェック"},{"id":"Q007","unit":"1","category":"単語・熟語","type":"4択","item":"U1-01","question":"「ドラム、太鼓」に当たる英語はどれですか？","answer":"drum","choices":["drum / cool / class / fall"],"explanation":"「ドラム、太鼓」は drum です。","level":"標準","midterm":false,"source":"Unit 1 単語チェック"},{"id":"Q008","unit":"1","category":"単語・熟語","type":"4択","item":"U1-01","question":"「〜について（の）」に当たる英語はどれですか？","answer":"about","choices":["about / hello / thing / Japan"],"explanation":"「〜について（の）」は about です。","level":"標準","midterm":false,"source":"Unit 1 単語チェック"},{"id":"Q009","unit":"1","category":"重要文","type":"日→英","item":"U1-01","question":"次の日本語を英語にしてください。\n「私はエリです。」","answer":"I'm Eri.","choices":[],"explanation":"基本文：I'm Eri.。","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q010","unit":"1","category":"重要文","type":"日→英","item":"U1-01","question":"次の日本語を英語にしてください。\n「私は日本出身です。」","answer":"I'm from Japan.","choices":[],"explanation":"基本文：I'm from Japan.。","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q011","unit":"1","category":"重要文","type":"日→英","item":"U1-02","question":"次の日本語を英語にしてください。\n「私は春が好きです。」","answer":"I like spring.","choices":[],"explanation":"基本文：I like spring.。","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q012","unit":"1","category":"重要文","type":"日→英","item":"U1-02","question":"次の日本語を英語にしてください。\n「私は春が好きではありません。」","answer":"I don't like spring.","choices":[],"explanation":"基本文：I don't like spring.。","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q013","unit":"1","category":"重要文","type":"日→英","item":"U1-03","question":"次の日本語を英語にしてください。\n「私はドラムを演奏できます。」","answer":"I can play the drums.","choices":[],"explanation":"基本文：I can play the drums.。","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q014","unit":"1","category":"文法・語順","type":"並べ替え","item":"U1-01","question":"「私はそこの生徒です。」\n語句を正しい順番に並べてください。","answer":"I'm a student there.","choices":[],"explanation":"","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q015","unit":"1","category":"文法・語順","type":"並べ替え","item":"U1-02","question":"「私は春が好きです。」\n語句を正しい順番に並べてください。","answer":"I like spring.","choices":[],"explanation":"","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q016","unit":"1","category":"文法・語順","type":"並べ替え","item":"U1-03","question":"「私はドラムを演奏できます。」\n語句を正しい順番に並べてください。","answer":"I can play the drums.","choices":[],"explanation":"","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q017","unit":"1","category":"文法・語順","type":"並べ替え","item":"U1-03","question":"「私はドラムを演奏できません。」\n語句を正しい順番に並べてください。","answer":"I can't play the drums.","choices":[],"explanation":"","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q018","unit":"1","category":"文法・語順","type":"並べ替え","item":"U1-02","question":"「私は春が好きではありません。」\n語句を正しい順番に並べてください。","answer":"I don't like spring.","choices":[],"explanation":"","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q019","unit":"1","category":"応用・総合","type":"4択","item":"U1-03","question":"「私はドラムを演奏できません。」の英文として正しいものは？","answer":"I can't play the drums.","choices":["I can't play the drums. / I don't play the drums. / I can play the drums. / I'm not play the drums."],"explanation":"can の否定は can't。can の後ろは動詞の原形です。","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q020","unit":"1","category":"応用・総合","type":"4択","item":"U1-02","question":"「I don't like spring.」の意味は？","answer":"私は春が好きではありません。","choices":["私は春が好きではありません。 / 私は春が好きです。 / 私は春に泳ぎます。 / 私は春について話します。"],"explanation":"一般動詞の否定は don't + 動詞の原形です。","level":"標準","midterm":false,"source":"Unit 1 重要文チェック"},{"id":"Q021","unit":"2","category":"単語・熟語","type":"4択","item":"U2-04","question":"「いつも、常に」に当たる英語はどれですか？","answer":"always","choices":["always / Friday / team / new"],"explanation":"「いつも、常に」は always です。","level":"標準","midterm":false,"source":"Unit 2 単語チェック"},{"id":"Q022","unit":"2","category":"単語・熟語","type":"4択","item":"U2-04","question":"「決して〜しない」に当たる英語はどれですか？","answer":"never","choices":["never / school / watch / great"],"explanation":"「決して〜しない」は never です。","level":"標準","midterm":false,"source":"Unit 2 単語チェック"},{"id":"Q023","unit":"2","category":"単語・熟語","type":"4択","item":"U2-04","question":"「練習する」に当たる英語はどれですか？","answer":"practice","choices":["practice / team / new / father"],"explanation":"「練習する」は practice です。","level":"標準","midterm":false,"source":"Unit 2 単語チェック"},{"id":"Q024","unit":"2","category":"単語・熟語","type":"4択","item":"U2 om?","choices":[],"explanation":"基本文：Is this our classroom?。","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q087","unit":"4","category":"重要文","type":"日→英","item":"U4-05","question":"次の日本語を英語にしてください。\n「はい、そうです。」","answer":"Yes, it is.","choices":[],"explanation":"基本文：Yes, it is.。","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q088","unit":"4","category":"文法・語順","type":"並べ替え","item":"U4-03","question":"「あれは誰ですか。」\n語句を正しい順番に並べてください。","answer":"Who's that?","choices":[],"explanation":"","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q089","unit":"4","category":"文法・語順","type":"並べ替え","item":"U4-04","question":"「これは私たちの教室ですか。」\n語句を正しい順番に並べてください。","answer":"Is this our classroom?","choices":[],"explanation":"","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q090","unit":"4","category":"文法・語順","type":"並べ替え","item":"U4-05","question":"「はい、そうです。」\n語句を正しい順番に並べてください。","answer":"Yes, it is.","choices":[],"explanation":"","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q091","unit":"4","category":"文法・語順","type":"並べ替え","item":"U4-05","question":"「いいえ、違います。」\n語句を正しい順番に並べてください。","answer":"No, it isn't.","choices":[],"explanation":"","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q092","unit":"4","category":"文法・語順","type":"並べ替え","item":"U4-06","question":"「これは私たちの教室ではありません。」\n語句を正しい順番に並べてください。","answer":"This is not our classroom.","choices":[],"explanation":"","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q093","unit":"4","category":"文法・語順","type":"並べ替え","item":"U4-07","question":"「あれは誰の筆箱ですか。」\n語句を正しい順番に並べてください。","answer":"Whose pencil case is that?","choices":[],"explanation":"","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q094","unit":"4","category":"文法・語順","type":"並べ替え","item":"U4-07","question":"「それは誰のものですか。」\n語句を正しい順番に並べてください。","answer":"Whose is it?","choices":[],"explanation":"","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q095","unit":"4","category":"文法・語順","type":"並べ替え","item":"U4-02","question":"「彼女は私たちの英語の先生です。」\n語句を正しい順番に並べてください。","answer":"She's our English teacher.","choices":[],"explanation":"","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q096","unit":"4","category":"応用・総合","type":"4択","item":"U4-03","question":"Who's that? の意味は？","answer":"あれは誰ですか？","choices":["あれは誰ですか？ / あれは何ですか？ / あれは誰のものですか？ / これは誰ですか？"],"explanation":"Who's = Who is。","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q097","unit":"4","category":"応用・総合","type":"4択","item":"U4-05","question":"Is this our classroom? への「はい、そうです。」は？","answer":"Yes, it is.","choices":["Yes, it is. / Yes, I am. / Yes, I do. / Yes, she is."],"explanation":"Is ～? には Yes, it is. / No, it isn't.。","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q098","unit":"4","category":"応用・総合","type":"4択","item":"U4-07","question":"Whose is it? の意味は？","answer":"それは誰のものですか？","choices":["それは誰のものですか？ / それは何ですか？ / それは誰ですか？ / それはあなたの教室ですか？"],"explanation":"Whose は「誰の、誰のもの」。","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q099","unit":"4","category":"応用・総合","type":"4択","item":"U4-06","question":"This is not our classroom. の意味は？","answer":"これは私たちの教室ではありません。","choices":["これは私たちの教室ではありません。 / これは私たちの教室です。 / あれは私たちの教室ではありません。 / これは誰の教室ですか？"],"explanation":"This is not ～ は「これは～ではありません」。","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"},{"id":"Q100","unit":"4","category":"応用・総合","type":"正誤","item":"U4-07","question":"次の英文は正しいですか？\nWhose pencil case is that?","answer":"○","choices":["○ / ×"],"explanation":"Whose + 名詞 + is ～? の形です。","level":"標準","midterm":true,"source":"Unit 4 重要文チェック"}];
const STORAGE_KEY="ch1english_training_v1";
let state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{"history":{},"item":{}}');
let session=[],pos=0,sessionCorrect=0,modeLabel="";

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function el(id){return document.getElementById(id)}
function screens(){return document.querySelectorAll(".screen")}
function show(id){screens().forEach(x=>x.classList.remove("active"));el(id).classList.add("active");window.scrollTo(0,0)}
function goHome(){updateWrongCount();show("home")}
function showUnits(){show("units")}
function updateWrongCount(){el("wrongCount").textContent=wrongQuestions().length+"問"}
function wrongQuestions(){return QUESTIONS.filter(q=>state.history[q.id] && state.history[q.id].wrong>0 && (state.history[q.id].wrong>=state.history[q.id].correct || state.history[q.id].lastCorrect===false))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function startMode(mode,unit){
 let pool=[];
 if(mode==="today"){pool=shuffle(QUESTIONS).slice(0,10);modeLabel="今日の10問";}
 if(mode==="midterm"){pool=shuffle(QUESTIONS.filter(q=>q.midterm)).slice(0,10);modeLabel="中間テスト対策";}
 if(mode==="unit"){pool=shuffle(QUESTIONS.filter(q=>Number(q.unit)===unit)).slice(0,10);modeLabel="Unit "+unit;}
 if(mode==="wrong"){pool=shuffle(wrongQuestions()).slice(0,10);modeLabel="間違えた問題";}
 if(!pool.length){alert(mode==="wrong"?"まだ復習対象の問題がありません。":"問題がありません。");return}
 session=pool;pos=0;sessionCorrect=0;show("quiz");renderQuestion();
}
function renderQuestion(){
 const q=session[pos], pct=(pos/session.length)*100;
 el("qmeta").innerHTML=`${modeLabel}　｜　${pos+1} / ${session.length}　 <span class="badge">Unit ${q.unit}</span>`;
 el("bar").style.width=pct+"%";el("qtext").textContent=q.question;el("feedback").innerHTML="";el("nextBtn").classList.add("hidden");
 const a=el("answerArea");a.innerHTML="";
 if(q.type==="4択" && q.choices.length){
   const box=document.createElement("div");box.className="choices";
   shuffle(q.choices).forEach(c=>{const b=document.createElement("button");b.className="choice";b.textContent=c;b.onclick=()=>answer(c,q,b);box.appendChild(b)});a.appendChild(box);
 } else if(q.type==="正誤"){
   const box=document.createElement("div");box.className="choices";
   ["正しい","まちがい"].forEach(c=>{const b=document.createElement("button");b.className="choice";b.textContent=c;b.onclick=()=>answer(c==="正しい"?"○":"×",q,b);box.appendChild(b)});a.appendChild(box);
 } else {
   const input=document.createElement("input");input.className="input";input.placeholder="答えを入力";input.autocomplete="off";
   const b=document.createElement("button");b.className="primary";b.textContent="答えを確認";b.onclick=()=>answer(input.value.trim(),q,b);
   input.addEventListener("keydown",e=>{if(e.key==="Enter")b.click()});a.append(input,b);
 }
}
function normalize(s){return String(s||"").trim().replace(/[　\s]/g,"").replace(/[。．.!！?？]/g,"").toLowerCase().replace(/’/g,"'")}
function isCorrect(user,q){
 const u=normalize(user), a=normalize(q.answer);
 if(q.type==="正誤") return u===a;
 if(q.type==="日→英" || q.type==="英→日" || q.type==="並べ替え") return u===a;
 return u===a;
}
function answer(user,q,button){
 if(button.dataset.done)return; button.dataset.done="1";
 const ok=isCorrect(user,q);
 if(button.classList.contains("choice"))button.classList.add(ok?"correct":"wrong");
 const h=state.history[q.id]||{attempts:0,correct:0,wrong:0,lastCorrect:false};
 h.attempts++; if(ok)h.correct++;else h.wrong++;h.lastCorrect=ok;state.history[q.id]=h;
 const it=state.item[q.item]||{attempts:0,correct:0};it.attempts++;if(ok)it.correct++;state.item[q.item]=it;save();
 if(ok)sessionCorrect++;
 el("feedback").innerHTML=`<div class="feedback ${ok?"ok":"ng"}"><b>${ok?"⭕ 正解！":"❌ 不正解"}</b><br>${ok?"":"正解：<b>"+html(q.answer)+"</b><br>"}${html(q.explanation)}</div>`;
 el("nextBtn").classList.remove("hidden"); if(pos===session.length-1)el("nextBtn").textContent="結果を見る →";
}
function html(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nextQuestion(){if(pos<session.length-1){pos++;renderQuestion()}else finish()}
function finish(){el("rCorrect").textContent=sessionCorrect;el("rTotal").textContent=session.length;el("rRate").textContent=Math.round(sessionCorrect/session.length*100)+"%";el("resultText").textContent=`${modeLabel}を終了しました。${sessionCorrect} / ${session.length} 問正解です。`;show("result");updateWrongCount()}
function showStats(){
 const vals=Object.values(state.history),attempts=vals.reduce((a,x)=>a+x.attempts,0),correct=vals.reduce((a,x)=>a+x.correct,0);
 el("sAttempts").textContent=attempts;el("sCorrect").textContent=correct;el("sRate").textContent=attempts?Math.round(correct/attempts*100)+"%":"0%";
 const items={};QUESTIONS.forEach(q=>{if(!items[q.item])items[q.item]={name:q.item,attempts:0,correct:0};if(state.item[q.item]){items[q.item].attempts=state.item[q.item].attempts;items[q.item].correct=state.item[q.item].correct}});
 el("itemStats").innerHTML=Object.values(items).map(x=>`<div class="row"><b>${x.name}</b><div class="muted">${x.attempts?Math.round(x.correct/x.attempts*100):0}%　（${x.correct}/${x.attempts}）</div></div>`).join("");
 show("stats");
}
function resetData(){if(confirm("学習履歴をすべて削除しますか？")){state={history:{},item:{}};save();showStats();updateWrongCount()}}
updateWrongCount();
</script>
